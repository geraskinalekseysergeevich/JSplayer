<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSplayer</title>
    <meta name="description" content="Music player with a live audio visualizer. Free tracks from Audius, synced lyrics from LRCLIB.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233C1616'/%3E%3Cpath d='M9 22V10m5 12V6m5 16V13m5 9V9' stroke='%23D33D34' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="wrapper">
        <div class="upper">
            <div class="player sounded">
                <div class="song_img"><img class="song_img_src" alt=""></div>
                <div class="song_data">
                    <div class="song_title">&nbsp;</div>
                    <div class="autor">&nbsp;</div>
                </div>
                <audio class='audio' preload='metadata'></audio>
                <div class="buttons">
                    <div class="btn shuffle"><img class="btn_img shuffle_btn" src="icons/shuffle.svg" alt=""></div>
                    <div class="btn prev"><img class="btn_img prev_img" src="icons/prev.svg" alt=""></div>
                    <div class="btn play"><img class="btn_img play_btn" src="icons/play.svg" alt=""></div>
                    <div class="btn next"><img class="btn_img next_img" src="icons/next.svg" alt=""></div>
                    <div class="btn sound"><img class="btn_img sound_btn" src="icons/soundon.svg" alt=""></div>
                </div>
                <div class="timeline">
                    <div class="current_time time">0:00</div>
                    <div class="progress_bar">
                        <div class="progress"></div>
                        <div class="dot"></div>
                    </div>
                    <div class="duration time">4:23</div>
                </div>
            </div>
        </div>
        <div class="lower"></div>
    </div>

    <aside class="panel" id="panel" aria-label="Tracks">
        <div class="panel_head">
            <input id="search" type="search" placeholder="Search tracks…" autocomplete="off" aria-label="Search tracks">
            <button class="icon_btn panel_close" id="panel_close" aria-label="Close">&times;</button>
        </div>
        <div class="panel_title" id="list_title">Trending</div>
        <ul class="tracklist" id="tracklist"></ul>
    </aside>
    <aside class="lyrics" id="lyrics" aria-label="Lyrics"><div class="lyrics_inner" id="lyrics_inner"></div></aside>
    <div class="modes" id="modes" role="toolbar" aria-label="Visualizer">
        <button data-mode="bars" class="on">Bars</button>
        <button data-mode="wave">Wave</button>
        <button data-mode="radial">Radial</button>
        <button data-mode="sparks">Sparks</button>
    </div>
    <button class="fab" id="panel_open">Tracks</button>
    <div class="credits">Music: <a href="https://audius.co" target="_blank" rel="noopener">Audius</a> &middot; Lyrics: <a href="https://lrclib.net" target="_blank" rel="noopener">LRCLIB</a></div>
    <div class="toast" id="toast" role="status"></div>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="lyrics.js"></script>
    <script src="visualizer.js"></script>
    <script src="script.js"></script>
</body>
</html>
